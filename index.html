<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>呷嘎的秘密偶像公主排拆系統</title>
  <style>
    :root {
      --bg-pink: #fff5f9;
      --bg-lavender: #f5f0ff;
      --card-white: rgba(255, 255, 255, 0.94);
      --pink-deep: #d81b60;
      --purple-deep: #7b1fa2;
      --blue-bind: #1565c0;
      --red-vip: #d50000;
      --purple-buyer: #6a1b9a;
      --text-main: #3e2747;
      --text-muted: #7c6685;
      --border-soft: #f3d6e4;
      --shadow-soft: 0 10px 28px rgba(186, 104, 200, 0.14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      color: var(--text-main);
      background:
        radial-gradient(circle at 12% 10%, #ffe4ef 0%, transparent 38%),
        radial-gradient(circle at 88% 15%, #e8dcff 0%, transparent 40%),
        radial-gradient(circle at 50% 95%, #e1f5fe 0%, transparent 45%),
        linear-gradient(160deg, var(--bg-pink), var(--bg-lavender));
      min-height: 100vh;
      padding-bottom: 92px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 40;
      backdrop-filter: blur(12px);
      background: rgba(255, 250, 253, 0.9);
      border-bottom: 1.5px solid var(--border-soft);
      padding: 12px 16px;
    }

    .header-inner {
      max-width: 1180px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand { display: flex; align-items: center; gap: 10px; }

    .brand-badge {
      background: linear-gradient(135deg, #ff9ec4, #c5a3ff);
      color: #fff;
      font-weight: 800;
      padding: 8px 12px;
      border-radius: 16px;
      font-size: 15px;
      box-shadow: 0 4px 12px rgba(216, 27, 96, 0.2);
    }

    .brand h1 { margin: 0; font-size: 17px; font-weight: 800; }
    .brand small { display: block; font-size: 12px; color: var(--text-muted); }

    .pool-tabs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

    .pool-tab {
      border: 1.5px solid #e6c7f5;
      background: #fff;
      color: var(--purple-deep);
      padding: 6px 13px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .pool-tab.active {
      background: linear-gradient(135deg, #ff80ab, #b388ff);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 4px 12px rgba(179, 136, 255, 0.35);
    }

    .nav-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

    .sync-pill {
      font-size: 12px;
      font-weight: 800;
      padding: 5px 10px;
      border-radius: 999px;
      background: #fff3f8;
      color: var(--pink-deep);
      border: 1px solid #f4b8d1;
    }

    .btn {
      border: none;
      border-radius: 14px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .btn:hover { filter: brightness(0.98); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .btn-primary {
      background: linear-gradient(135deg, #ff7eb3, #a685ff);
      color: #fff;
      box-shadow: 0 4px 12px rgba(255, 126, 179, 0.3);
    }

    .btn-soft {
      background: #fff;
      color: var(--text-main);
      border: 1.5px solid var(--border-soft);
    }

    .btn-danger {
      background: #ffebee;
      color: #c62828;
      border: 1px solid #ffcdd2;
    }

    .btn-sm { padding: 5px 10px; font-size: 12px; border-radius: 10px; }

    .unread-badge {
      background: #ff1744;
      color: #fff;
      font-size: 11px;
      font-weight: 900;
      padding: 1px 6px;
      border-radius: 999px;
      line-height: 1.3;
    }

    .container { max-width: 1180px; margin: 16px auto; padding: 0 14px; }

    .top-banner {
      background: var(--card-white);
      border: 1.5px solid var(--border-soft);
      border-radius: 22px;
      padding: 14px 18px;
      box-shadow: var(--shadow-soft);
      margin-bottom: 16px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
      align-items: center;
    }

    .stat-box {
      background: linear-gradient(135deg, #fff8fb, #f8f3ff);
      border-radius: 16px;
      padding: 10px 14px;
      border: 1px solid #f4dff0;
    }

    .stat-label { font-size: 12px; color: var(--text-muted); }
    .stat-val { font-size: 18px; font-weight: 800; margin-top: 2px; }

    .progress-wrap {
      width: 100%;
      height: 10px;
      background: #fce4ec;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 6px;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #ff80ab, #b388ff, #80deea);
      transition: width 0.3s ease;
    }

    .mode-switch { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }

    .mode-btn {
      padding: 9px 16px;
      border-radius: 16px;
      border: 1.5px solid #e7c9f6;
      background: #fff;
      font-weight: 800;
      font-size: 14px;
      color: var(--text-main);
      cursor: pointer;
    }

    .mode-btn.active {
      background: linear-gradient(135deg, #ff80ab, #ce93d8);
      color: #fff;
      border-color: transparent;
    }

    .panel { display: none; }
    .panel.active { display: block; }

    .rules-card, .box-card {
      background: var(--card-white);
      border: 1.5px solid var(--border-soft);
      border-radius: 22px;
      padding: 16px 18px;
      box-shadow: var(--shadow-soft);
      margin-bottom: 16px;
    }

    .rules-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 10px;
      font-size: 13px;
      line-height: 1.65;
    }

    .rule-pill {
      background: #fff9fc;
      border: 1px dashed #f4a7c4;
      border-radius: 14px;
      padding: 10px 12px;
    }

    .contact-strip {
      margin-top: 10px;
      background: linear-gradient(135deg, #fff3f8, #f6efff);
      border: 1.5px solid #e8c9f7;
      border-radius: 14px;
      padding: 10px 14px;
      font-size: 13px;
      line-height: 1.6;
    }

    .set-banner {
      background: #fff;
      border: 1.5px solid #ebd2f8;
      border-radius: 20px;
      padding: 12px 16px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-soft);
    }

    .set-banner img {
      width: 100%;
      max-height: 460px;
      object-fit: contain;
      border-radius: 14px;
      background: #fff8fc;
      margin-top: 8px;
      border: 1px solid #f4e1ee;
    }

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
      align-items: center;
    }

    .filter-chip {
      padding: 6px 12px;
      border-radius: 999px;
      border: 1.5px solid #ebd2f8;
      background: #fff;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      color: var(--purple-deep);
    }

    .filter-chip.active { background: #9c27b0; color: #fff; border-color: #9c27b0; }

    .search-input {
      padding: 7px 12px;
      border-radius: 12px;
      border: 1.5px solid #e7c9f6;
      background: #fff;
      font-size: 13px;
      min-width: 180px;
    }

    .buyer-bar {
      background: var(--card-white);
      border: 1.5px solid var(--border-soft);
      border-radius: 20px;
      padding: 14px 16px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-soft);
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }

    .buyer-identity { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }

    .buyer-identity input, .buyer-identity select {
      padding: 8px 12px;
      border-radius: 12px;
      border: 1.5px solid #dfb8f2;
      font-size: 13px;
      background: #fff;
    }

    .phone-status {
      font-size: 11.5px;
      font-weight: 700;
      margin-top: 3px;
      display: block;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
      gap: 14px;
    }

    .idol-card {
      position: relative;
      background: #fff;
      border-radius: 20px;
      border: 2px solid #f6d8e8;
      padding: 10px;
      box-shadow: 0 6px 18px rgba(171, 130, 196, 0.12);
      cursor: pointer;
      transition: transform 0.16s, border-color 0.16s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .idol-card:hover { transform: translateY(-3px); }

    .idol-card.selected {
      border-color: #ff4081;
      background: linear-gradient(180deg, #fff5f9, #f9f2ff);
      box-shadow: 0 0 0 3px rgba(255, 64, 129, 0.18);
    }

    .idol-card.has-queue { border-color: #d1c4e9; }

    .star-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 2;
      background: linear-gradient(135deg, #ffd54f, #ff8a65);
      color: #4a148c;
      font-weight: 800;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
    }

    .qty-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 2;
      background: rgba(255, 255, 255, 0.94);
      border: 1.5px solid #e1bee7;
      color: #6a1b9a;
      font-weight: 800;
      font-size: 11px;
      padding: 3px 7px;
      border-radius: 999px;
    }

    .card-thumb {
      width: 100%;
      min-height: 118px;
      border-radius: 14px;
      background: linear-gradient(145deg, #ffeef5, #efe8ff, #e3f7ff);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 26px 8px 10px;
      border: 1px solid #f4e1ee;
    }

    .card-code {
      font-size: 11px;
      font-weight: 800;
      color: #9c27b0;
      background: rgba(255, 255, 255, 0.85);
      padding: 2px 7px;
      border-radius: 8px;
      margin-bottom: 4px;
    }

    .card-name { font-size: 12.5px; font-weight: 800; line-height: 1.3; }

    .same-demand-pill {
      margin-top: 6px;
      font-size: 11px;
      font-weight: 800;
      color: #7b1fa2;
      background: #f3e5f5;
      padding: 2px 7px;
      border-radius: 8px;
      display: inline-block;
    }

    .price-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
      gap: 4px;
    }

    .price-moon { font-size: 14px; font-weight: 900; color: var(--pink-deep); }

    .bind-blue {
      font-size: 11.5px;
      font-weight: 800;
      color: var(--blue-bind);
      background: #e3f2fd;
      padding: 2px 6px;
      border-radius: 8px;
    }

    .queue-codes {
      margin-top: 7px;
      padding-top: 6px;
      border-top: 1px dashed #f2d4e6;
      min-height: 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center;
    }

    .code-tag {
      font-size: 11px;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 6px;
      background: #faf5ff;
      border: 1px solid #e1bee7;
    }

    .code-red { color: var(--red-vip); border-color: #ef9a9a; background: #ffebee; }
    .code-purple { color: var(--purple-buyer); }

    /* 底部固定列（手機版也保留查單與聊天室入口） */
    .cart-dock {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 45;
      background: rgba(255, 252, 254, 0.96);
      backdrop-filter: blur(12px);
      border-top: 1.5px solid #f4b8d1;
      box-shadow: 0 -6px 20px rgba(186, 104, 200, 0.16);
      padding: 6px 12px;
    }

    .cart-dock-inner {
      max-width: 1180px;
      margin: 0 auto;
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .cart-summary {
      font-size: 12.5px;
      font-weight: 700;
      line-height: 1.3;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cart-summary strong { color: var(--pink-deep); font-size: 14.5px; }

    .cart-dock-actions {
      display: flex;
      gap: 5px;
      align-items: center;
      flex-shrink: 0;
    }

    @media (max-width: 680px) {
      body { padding-bottom: 72px; }
      .cart-dock { padding: 5px 8px; }
      .cart-dock-inner { gap: 5px; }
      .cart-summary { font-size: 11px; }
      .cart-summary strong { font-size: 13px; }
      .cart-dock-actions .btn { padding: 5px 7px; font-size: 11.5px; border-radius: 10px; }
    }

    .admin-section {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px dashed #e6c7f5;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .contact-form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
      margin-top: 10px;
      width: 100%;
    }

    .contact-form-grid input, .contact-form-grid textarea {
      width: 100%;
      padding: 8px 11px;
      border-radius: 10px;
      border: 1.5px solid #dfb8f2;
      font-size: 13px;
      background: #fff;
    }

    .won-card-chip {
      display: inline-block;
      background: #fff4fa;
      border: 1px solid #f4b8d1;
      color: var(--text-main);
      font-size: 12px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 9px;
      margin: 2px 3px 2px 0;
    }

    .dm-layout { display: grid; grid-template-columns: 240px 1fr; gap: 12px; margin-top: 10px; }
    @media (max-width: 720px) { .dm-layout { grid-template-columns: 1fr; } }

    .dm-thread-list {
      border: 1.5px solid #ebd2f8;
      border-radius: 14px;
      background: #fff9fc;
      padding: 8px;
      max-height: 300px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .dm-thread-btn {
      text-align: left;
      border: 1.5px solid #f0d7fa;
      background: #fff;
      border-radius: 12px;
      padding: 8px 10px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .dm-thread-btn.active {
      background: linear-gradient(135deg, #ff80ab, #b388ff);
      color: #fff;
      border-color: transparent;
    }

    .dm-box {
      border: 1.5px solid #ebd2f8;
      border-radius: 14px;
      background: #fff;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .dm-messages {
      max-height: 240px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 6px;
      background: #fff8fc;
      border-radius: 12px;
    }

    .dm-msg {
      max-width: 82%;
      padding: 8px 12px;
      border-radius: 14px;
      font-size: 13px;
      line-height: 1.5;
      word-break: break-word;
    }

    .dm-msg.buyer { align-self: flex-start; background: #f3e5f5; }
    .dm-msg.admin { align-self: flex-end; background: linear-gradient(135deg, #ff7eb3, #a685ff); color: #fff; }
    .dm-meta { font-size: 10.5px; opacity: 0.85; margin-top: 3px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .read-tag-yes { font-weight: 800; color: #e8f5e9; background: rgba(0, 0, 0, 0.22); padding: 1px 5px; border-radius: 6px; }
    .read-tag-no { font-weight: 700; opacity: 0.85; }
    .dm-msg.buyer .read-tag-yes { color: #2e7d32; background: #e8f5e9; }

    .check-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 700;
      background: #fff8fc;
      border: 1px solid #ebd2f8;
      border-radius: 8px;
      padding: 3px 7px;
      margin-right: 4px;
      margin-bottom: 3px;
      cursor: pointer;
    }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 9px 8px; border-bottom: 1px solid #f5e1ee; text-align: left; vertical-align: middle; }
    th { background: #fff5fa; color: var(--purple-deep); font-weight: 800; }

    .num-input {
      width: 82px;
      padding: 5px 6px;
      border-radius: 8px;
      border: 1.5px solid #dfb8f2;
      font-weight: 700;
      text-align: center;
    }

    .name-edit-input {
      width: 195px;
      padding: 5px 8px;
      border-radius: 8px;
      border: 1.5px solid #dfb8f2;
      font-size: 12.5px;
      font-weight: 700;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(52, 24, 68, 0.45);
      backdrop-filter: blur(4px);
      z-index: 60;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      background: #fff;
      border-radius: 24px;
      max-width: 640px;
      width: 100%;
      max-height: 88vh;
      overflow-y: auto;
      padding: 20px;
      border: 2px solid #f4b8d1;
      box-shadow: 0 20px 50px rgba(106, 27, 154, 0.25);
    }

    .alert-box {
      background: #fff8e1;
      border: 1.5px solid #ffca28;
      color: #6d4c00;
      border-radius: 14px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 700;
      margin: 10px 0;
    }

    .deposit-box {
      background: #fce4ec;
      border: 1.5px solid #f06292;
      color: #880e4f;
      border-radius: 14px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 800;
      margin: 10px 0;
    }

    .tag-win { background: #e8f5e9; color: #2e7d32; padding: 2px 7px; border-radius: 8px; font-size: 11px; font-weight: 800; }
    .tag-wait { background: #ede7f6; color: #5e35b1; padding: 2px 7px; border-radius: 8px; font-size: 11px; font-weight: 800; }
    .tag-cancel { background: #ffebee; color: #c62828; padding: 2px 7px; border-radius: 8px; font-size: 11px; font-weight: 800; }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <div class="brand-badge">🌷 併團排卡</div>
      <div>
        <h1 id="pageTitle">呷嘎的秘密偶像公主排拆系統</h1>
        <small>預售單張排卡｜紅字🔒 ＞ 金額高 ＞ 數量多 ＞ 先喊</small>
      </div>
    </div>
    <div class="pool-tabs" id="poolTabs"></div>
    <div class="nav-actions">
      <span id="cloudStatusBadge" class="sync-pill">☁️ 本機＋雲端</span>
      <button class="btn btn-soft btn-sm" onclick="syncFromCloud(true)">🔄 同步</button>
      <button class="btn btn-soft btn-sm" onclick="openLookupModal()">🔎 輸電話查單／撤單</button>
      <button class="btn btn-soft btn-sm" onclick="openRulesModal()">📜 喊單規則</button>
      <button class="btn btn-primary btn-sm" onclick="openAdminLogin()">👑 老闆後台 <span id="adminHeaderUnreadBadge" class="unread-badge" style="display:none;">0</span></button>
    </div>
  </div>
</header>

<div class="container">
  <div class="top-banner" id="poolStatsBanner"></div>

  <div class="mode-switch">
    <button class="mode-btn active" id="tabBuyer" onclick="switchMode('buyer')">🛍️ 買家挑卡排單</button>
    <button class="mode-btn" id="tabQueue" onclick="switchMode('queue')">📊 排單順位＆對帳總表</button>
    <button class="mode-btn" id="tabMaster" onclick="switchMode('master')">📚 基準盤設定</button>
    <button class="mode-btn" id="tabAdmin" onclick="openAdminLogin()" style="display:none;">👑 本盤管理後台 <span id="adminTabUnreadBadge" class="unread-badge" style="display:none;">0</span></button>
  </div>

  <!-- 完整 HTML 結構與 JS 邏輯已儲存於 dream_macaron_pool_complete_v3_15_fixed.html -->
